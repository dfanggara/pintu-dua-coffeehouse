name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_PATH || '/var/www/pintu-dua-coffeehouse' }}"
            bash "${APP_DIR}/deploy/ec2/deploy.sh"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            APP_DIR="${{ secrets.EC2_APP_PATH || '/var/www/pintu-dua-coffeehouse' }}"
            curl -sf -o /dev/null "http://127.0.0.1/" || (echo "Health check failed" && exit 1)
            echo "Health check passed — $(cd "${APP_DIR}" && git rev-parse --short HEAD)"
